# Scenario 05: Redis accidentally scaled to zero
id: redis-scaled-to-zero
title: Redis accidentally scaled to zero
fault_class: dependency_outage
description: An operator scales the shared Redis to 0 replicas; sessions and caches fail.
demo: true
fault:
  type: scale
  target: redis
  replicas: 0
expected:
  symptoms:
  - redis.scaled_to_zero
  - api-gateway.error_ratio
  root_cause:
    categories:
    - DEPENDENCY_FAILURE
    component: redis
  remediation:
    optimal:
    - action: scale_deployment
      target: redis
    acceptable:
    - action: scale_deployment
      target: redis
    prohibited:
    - action: rollback_deployment
      target: order-service
    - action: rollback_deployment
      target: auth-service
    - action: rollout_restart
      target: auth-service
    - action: rollout_restart
      target: order-service
    - action: '*'
      target: postgres
    - action: '*'
      target: shop-network
  outcomes:
  - resolved
  detection: required
verification:
  services:
  - redis
  - auth-service
  - api-gateway
tags:
- dependency
- approval
- stateful
environment: 'ShopFlow baseline: all services healthy under default synthetic traffic (browse 6/s, checkout 3/s)'
rollback_conditions: Revert any AegisOps action whose verification outcome is NO_EFFECT or DEGRADED.
