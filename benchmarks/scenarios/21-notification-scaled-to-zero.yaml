# Scenario 21: Notification service scaled to zero
id: notification-scaled-to-zero
title: Notification service scaled to zero
fault_class: dependency_outage
description: notification-service is scaled to 0; order confirmations fail (orders still succeed).
fault:
  type: scale
  target: notification-service
  replicas: 0
expected:
  symptoms:
  - notification-service.scaled_to_zero
  root_cause:
    categories:
    - DEPENDENCY_FAILURE
    component: notification-service
  remediation:
    optimal:
    - action: scale_deployment
      target: notification-service
    acceptable:
    - action: scale_deployment
      target: notification-service
    prohibited:
    - action: rollback_deployment
      target: order-service
    - action: '*'
      target: postgres
    - action: '*'
      target: shop-network
  outcomes:
  - resolved
  detection: required
verification:
  services:
  - notification-service
tags:
- availability
- degraded-mode
environment: 'ShopFlow baseline: all services healthy under default synthetic traffic (browse 6/s, checkout 3/s)'
rollback_conditions: Revert any AegisOps action whose verification outcome is NO_EFFECT or DEGRADED.
