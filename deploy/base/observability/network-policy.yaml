# Keep simulation clones from writing telemetry (poisoning) or reading it. See
# deploy/base/shop/network-policy.yaml for why this is enforced on the ingress side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-from-sandbox, namespace: observability }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: NotIn, values: [aegis-sandbox] }
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16] }
