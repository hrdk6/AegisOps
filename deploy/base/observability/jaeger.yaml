apiVersion: v1
kind: ConfigMap
metadata: { name: jaeger-config, namespace: observability }
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        logs: { level: warn }
    extensions:
      healthcheckv2:
        use_v2: true
        http: { endpoint: 0.0.0.0:13133 }
      jaeger_query:
        storage: { traces: memstore }
        http: { endpoint: 0.0.0.0:16686 }
      jaeger_storage:
        backends:
          memstore:
            memory: { max_traces: 20000 }
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter:
        trace_storage: memstore
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: observability, labels: { app: jaeger } }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.7.0
          args: ["--config=/etc/jaeger/config.yaml"]
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          readinessProbe: { httpGet: { path: /status, port: health }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 640Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/jaeger }]
      volumes:
        - { name: config, configMap: { name: jaeger-config } }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: observability }
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui, nodePort: 30686 }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
