apiVersion: v1
kind: ConfigMap
metadata: { name: shop-common, namespace: shop }
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  API_GATEWAY_URL: http://api-gateway:8080
  AUTH_SERVICE_URL: http://auth-service:8080
  ORDER_SERVICE_URL: http://order-service:8080
  INVENTORY_SERVICE_URL: http://inventory-service:8080
  PAYMENT_SERVICE_URL: http://payment-service:8080
  NOTIFICATION_SERVICE_URL: http://notification-service:8080
---
apiVersion: v1
kind: ConfigMap
metadata: { name: auth-config, namespace: shop }
data:
  AUTH_CONFIG: '{"token_ttl_seconds": 3600, "issuer": "shopflow"}'
