# AegisOps API, reasoning engine and demo fault injector.
# Secrets (aegis-db, aegis-approval-key, aegis-api, aegis-chaos, aegis-users, aegis-llm)
# are generated by scripts/devctl.py and never committed.
apiVersion: v1
kind: ConfigMap
metadata: { name: aegis-config, namespace: aegis-system }
data:
  AEGIS_ENVIRONMENT: development
  AEGIS_DB_HOST: aegis-postgres
  AEGIS_DB_USER: aegis
  AEGIS_DB_NAME: aegis
  AEGIS_CONTROLPLANE_URL: http://aegis-controlplane.aegis-system.svc:8082
  AEGIS_CONTROLPLANE_TOKEN_FILE: /var/run/secrets/aegis/token
  AEGIS_MANAGED_NAMESPACE: shop
  AEGIS_PROMETHEUS_URL: http://prometheus.observability.svc:9090
  AEGIS_LOKI_URL: http://loki.observability.svc:3100
  AEGIS_JAEGER_URL: http://jaeger.observability.svc:16686
  AEGIS_JAEGER_PUBLIC_URL: http://localhost:16686
  AEGIS_GRAFANA_PUBLIC_URL: http://localhost:3001
  AEGIS_CHAOS_URL: http://aegis-chaos.aegis-system.svc:8090
  AEGIS_CORS_ORIGINS: http://localhost:3000
  AEGIS_DEMO_MODE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-system
  labels: { app: aegis-api, app.kubernetes.io/part-of: aegisops }
spec:
  replicas: 1
  selector: { matchLabels: { app: aegis-api } }
  template:
    metadata:
      labels: { app: aegis-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      serviceAccountName: aegis-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: migrate
          image: aegisops/aegis:dev
          command: [aegis-migrate]
          envFrom: [{ configMapRef: { name: aegis-config } }]
          env:
            - name: AEGIS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: aegis-db, key: password } }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      containers:
        - name: aegis-api
          image: aegisops/aegis:dev
          command: [aegis-api]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: aegis-config } }]
          env:
            - name: AEGIS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: aegis-db, key: password } }
            - name: AEGIS_JWT_SECRET
              valueFrom: { secretKeyRef: { name: aegis-api, key: jwt-secret } }
            - name: AEGIS_APPROVAL_KEY
              valueFrom: { secretKeyRef: { name: aegis-approval-key, key: key } }
            - name: AEGIS_CHAOS_TOKEN
              valueFrom: { secretKeyRef: { name: aegis-chaos, key: token } }
            - name: AEGIS_BOOTSTRAP_USERS
              valueFrom: { secretKeyRef: { name: aegis-users, key: users } }
            - { name: OTEL_SERVICE_NAME, value: aegis-api }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: cp-token, mountPath: /var/run/secrets/aegis, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Audience-bound, short-lived token accepted only by the control-plane API.
        - name: cp-token
          projected:
            sources:
              - serviceAccountToken: { audience: aegisops-controlplane, expirationSeconds: 3600, path: token }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: aegis-api, namespace: aegis-system }
spec:
  type: NodePort
  selector: { app: aegis-api }
  ports: [{ name: http, port: 8000, targetPort: http, nodePort: 30800 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-engine
  namespace: aegis-system
  labels: { app: aegis-engine, app.kubernetes.io/part-of: aegisops }
spec:
  replicas: 1
  strategy: { type: Recreate }  # single active reasoning loop
  selector: { matchLabels: { app: aegis-engine } }
  template:
    metadata:
      labels: { app: aegis-engine }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8090" }
    spec:
      serviceAccountName: aegis-engine
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: aegis-engine
          image: aegisops/aegis:dev
          command: [aegis-engine]
          ports: [{ name: http, containerPort: 8090 }]
          envFrom:
            - configMapRef: { name: aegis-config }
            # Optional model provider keys (OPENAI_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, NVIDIA_API_KEY,
            # OLLAMA_BASE_URL, AEGIS_LLM_ROUTES). Without them the engine runs deterministic reasoning only.
            - secretRef: { name: aegis-llm, optional: true }
          env:
            - name: AEGIS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: aegis-db, key: password } }
            - { name: OTEL_SERVICE_NAME, value: aegis-engine }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15, initialDelaySeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: cp-token, mountPath: /var/run/secrets/aegis, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: cp-token
          projected:
            sources:
              - serviceAccountToken: { audience: aegisops-controlplane, expirationSeconds: 3600, path: token }
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-chaos
  namespace: aegis-system
  labels: { app: aegis-chaos, app.kubernetes.io/part-of: aegisops }
spec:
  replicas: 1
  selector: { matchLabels: { app: aegis-chaos } }
  template:
    metadata:
      labels: { app: aegis-chaos }
    spec:
      serviceAccountName: aegis-chaos
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: aegis-chaos
          image: aegisops/aegis:dev
          command: [aegis-chaos]
          ports: [{ name: http, containerPort: 8090 }]
          env:
            - { name: AEGIS_MANAGED_NAMESPACE, value: shop }
            - { name: AEGIS_DEMO_MODE, value: "true" }
            - name: AEGIS_CHAOS_TOKEN
              valueFrom: { secretKeyRef: { name: aegis-chaos, key: token } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: aegis-chaos, namespace: aegis-system }
spec:
  selector: { app: aegis-chaos }
  ports: [{ name: http, port: 8090, targetPort: http }]
