---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: canaryreleases.aegisops.io
spec:
  group: aegisops.io
  names:
    categories:
    - aegisops
    kind: CanaryRelease
    listKind: CanaryReleaseList
    plural: canaryreleases
    shortNames:
    - canary
    singular: canaryrelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef
      name: Target
      type: string
    - jsonPath: .spec.release.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.effectiveWeight
      name: Weight
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CanaryRelease progressively shifts traffic to a new release with
          SLO gates.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CanaryReleaseSpec describes a progressive rollout of a Deployment.
            properties:
              abort:
                description: Abort returns all traffic to stable (set by the abort_canary
                  action).
                type: boolean
              analysis:
                description: CanaryAnalysis holds the deterministic SLO gates evaluated
                  after each step.
                properties:
                  maxErrorRate:
                    description: Maximum tolerated canary 5xx ratio (0-1).
                    type: number
                  maxP95Ms:
                    description: Maximum tolerated canary p95 latency in milliseconds.
                    type: number
                  minRequests:
                    description: Minimum canary requests in the window for a verdict
                      to count.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - maxErrorRate
                - maxP95Ms
                - minRequests
                type: object
              paused:
                description: Paused halts progression (set by the pause_rollout action).
                type: boolean
              release:
                description: CanaryTemplate is the bounded set of changes a release
                  may make.
                properties:
                  env:
                    items:
                      description: |-
                        CanaryEnvVar is a literal environment variable (no valueFrom: releases cannot
                        reference Secrets).
                      properties:
                        name:
                          pattern: ^[A-Z_][A-Z0-9_]*$
                          type: string
                        value:
                          maxLength: 1024
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    maxItems: 32
                    type: array
                  image:
                    maxLength: 255
                    type: string
                  version:
                    maxLength: 64
                    type: string
                required:
                - image
                - version
                type: object
              steps:
                items:
                  description: CanaryStep shifts traffic weight and holds it for analysis.
                  properties:
                    pauseSeconds:
                      format: int32
                      maximum: 3600
                      minimum: 10
                      type: integer
                    weight:
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                  required:
                  - pauseSeconds
                  - weight
                  type: object
                maxItems: 10
                minItems: 1
                type: array
              targetRef:
                description: TargetRef is the name of the stable Deployment in the
                  same namespace.
                type: string
              totalReplicas:
                description: |-
                  TotalReplicas is the replica budget shared by stable and canary. Traffic
                  weight is approximated by replica ratio (no L7 traffic router).
                format: int32
                maximum: 20
                minimum: 2
                type: integer
            required:
            - analysis
            - release
            - steps
            - targetRef
            type: object
          status:
            description: CanaryReleaseStatus is owned by the controller.
            properties:
              analyses:
                items:
                  description: CanaryAnalysisResult records one analysis evaluation.
                  properties:
                    canaryErrorRate:
                      type: number
                    canaryP95Ms:
                      type: number
                    canaryRequests:
                      type: number
                    reason:
                      type: string
                    stableErrorRate:
                      type: number
                    stableP95Ms:
                      type: number
                    step:
                      format: int32
                      type: integer
                    time:
                      format: date-time
                      type: string
                    verdict:
                      type: string
                    weight:
                      format: int32
                      type: integer
                  required:
                  - canaryErrorRate
                  - canaryP95Ms
                  - canaryRequests
                  - stableErrorRate
                  - stableP95Ms
                  - step
                  - time
                  - verdict
                  - weight
                  type: object
                type: array
              canaryReplicas:
                format: int32
                type: integer
              completedAt:
                format: date-time
                type: string
              currentStep:
                format: int32
                type: integer
              effectiveWeight:
                format: int32
                type: integer
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              originalReplicas:
                format: int32
                type: integer
              phase:
                description: CanaryPhase is the lifecycle phase of a CanaryRelease.
                type: string
              stableReplicas:
                format: int32
                type: integer
              stepStartedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
