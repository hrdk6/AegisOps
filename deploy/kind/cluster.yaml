# Local AegisOps environment: a single-node kind cluster.
# NodePorts are mapped to fixed localhost ports (see docs/DEVELOPMENT.md).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegisops
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30300, hostPort: 3000, protocol: TCP }   # AegisOps UI
      - { containerPort: 30800, hostPort: 8000, protocol: TCP }   # AegisOps API
      - { containerPort: 30301, hostPort: 3001, protocol: TCP }   # Grafana
      - { containerPort: 30686, hostPort: 16686, protocol: TCP }  # Jaeger UI
      - { containerPort: 30090, hostPort: 9090, protocol: TCP }   # Prometheus
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }   # ShopFlow storefront
